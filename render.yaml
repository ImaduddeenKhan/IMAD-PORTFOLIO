services:
  - type: web
    name: portfolioimad
    runtime: node
    plan: free
    buildCommand: npm install && npm run build && mkdir -p .next/standalone/public && cp -r public/* .next/standalone/public/ 2>/dev/null; cp -r .next/static .next/standalone/.next/static 2>/dev/null; true
    startCommand: npm run start:standalone
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: NEXTAUTH_URL
        sync: false
      - key: NEXT_PUBLIC_SITE_URL
        sync: false
      - key: NEXT_PUBLIC_SITE_NAME
        value: Imad Portfolio
      - key: ADMIN_NAME
        value: Imaduddeen Khan
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: SUPABASE_BUCKET
        value: portfolios