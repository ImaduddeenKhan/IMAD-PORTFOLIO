name: Keep Supabase Alive

on:
  schedule:
    # Every 3 days at midnight UTC — prevents Supabase free-tier pausing (7-day inactivity limit)
    - cron: "0 0 */3 * *"
  workflow_dispatch: # Allow manual trigger

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping portfolio keep-alive endpoint
        run: |
          SITE_URL="${{ vars.SITE_URL || 'https://imadkhan.me' }}"
          echo "Pinging $SITE_URL/api/keep-alive ..."
          
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" "$SITE_URL/api/keep-alive" || true)
          echo "HTTP status: $RESPONSE"
          
          if [ "$RESPONSE" = "200" ]; then
            echo "✓ Keep-alive ping successful"
          else
            echo "⚠ Keep-alive returned $RESPONSE — site may be down"
          fi

      - name: Direct Supabase ping (fallback)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_KEY" ]; then
            echo "⏭ Supabase secrets not configured — skipping direct ping"
            exit 0
          fi
          
          echo "Pinging Supabase directly..."
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY" \
            "$SUPABASE_URL/rest/v1/site_content?select=id&limit=1" || true)
          echo "Supabase HTTP status: $RESPONSE"
          
          if [ "$RESPONSE" = "200" ]; then
            echo "✓ Supabase direct ping successful"
          else
            echo "⚠ Supabase returned $RESPONSE"
          fi
